name: Backup GitHub Secrets to Server

on:
  workflow_dispatch:  # Manual trigger only
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

env:
  SERVER_HOST: thakii-02.fds-1.com
  SERVER_USER: ec2-user
  SECRETS_BACKUP_PATH: /home/ec2-user/github-secrets-backup

jobs:
  backup-secrets:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup SSH Key Only (Skip Cloudflare)
      run: |
        echo "🔑 Setting up SSH private key..."
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.THAKII_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        echo "✅ SSH key configured"
    
    - name: Configure SSH for Direct Connection
      run: |
        echo "⚙️  Configuring SSH..."
        cat >> ~/.ssh/config << 'EOF'
        Host thakii-server
          HostName thakii-02.fds-1.com
          User ec2-user
          IdentityFile ~/.ssh/id_rsa
          ConnectTimeout 30
          ServerAliveInterval 60
          ServerAliveCountMax 3
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF
        chmod 600 ~/.ssh/config
        echo "✅ SSH configuration created"
    
    - name: Test SSH Connection
      run: |
        echo "🔍 Testing SSH connection..."
        if timeout 30s ssh -v thakii-server "echo '✅ SSH connection successful'" 2>&1; then
          echo "🎉 SSH connection is working!"
        else
          EXIT_CODE=$?
          echo "❌ SSH connection failed (exit code: $EXIT_CODE)"
          exit 1
        fi
    
    - name: Create Secrets Directory on Server
      run: |
        ssh thakii-server "
          set -e
          echo '📁 Creating secrets backup directory...'
          mkdir -p $SECRETS_BACKUP_PATH
          chmod 700 $SECRETS_BACKUP_PATH
          echo '✅ Directory created with restricted permissions'
        "
    
    - name: Backup SSH Private Key
      run: |
        ssh thakii-server "
          set -e
          echo '🔑 Backing up SSH Private Key...'
          cat > $SECRETS_BACKUP_PATH/THAKII_SSH_PRIVATE_KEY << 'SECRETEOF'
        ${{ secrets.THAKII_SSH_PRIVATE_KEY }}
        SECRETEOF
          chmod 600 $SECRETS_BACKUP_PATH/THAKII_SSH_PRIVATE_KEY
          echo '✅ SSH Private Key backed up'
        "
    
    - name: Backup SSH Password
      continue-on-error: true
      run: |
        if [ ! -z "${{ secrets.THAKII_SSH_PASSWORD }}" ]; then
          ssh thakii-server "
            set -e
            echo '🔑 Backing up SSH Password...'
            cat > $SECRETS_BACKUP_PATH/THAKII_SSH_PASSWORD << 'SECRETEOF'
          ${{ secrets.THAKII_SSH_PASSWORD }}
          SECRETEOF
            chmod 600 $SECRETS_BACKUP_PATH/THAKII_SSH_PASSWORD
            echo '✅ SSH Password backed up'
          "
        else
          echo "⏭️ SSH Password not configured, skipping..."
        fi
    
    - name: Backup Cloudflare Service Token
      continue-on-error: true
      run: |
        if [ ! -z "${{ secrets.THAKII_CLOUDFLARE_SERVICE_TOKEN }}" ]; then
          ssh thakii-server "
            set -e
            echo '🔑 Backing up Cloudflare Service Token...'
            cat > $SECRETS_BACKUP_PATH/THAKII_CLOUDFLARE_SERVICE_TOKEN << 'SECRETEOF'
          ${{ secrets.THAKII_CLOUDFLARE_SERVICE_TOKEN }}
          SECRETEOF
            chmod 600 $SECRETS_BACKUP_PATH/THAKII_CLOUDFLARE_SERVICE_TOKEN
            echo '✅ Cloudflare Service Token backed up'
          "
        else
          echo "⏭️ Cloudflare Service Token not configured, skipping..."
        fi
    
    - name: Backup Alternative Cloudflare Token
      continue-on-error: true
      run: |
        if [ ! -z "${{ secrets.CLOUDFLARE_SERVICE_TOKEN }}" ]; then
          ssh thakii-server "
            set -e
            echo '🔑 Backing up Alternative Cloudflare Token...'
            cat > $SECRETS_BACKUP_PATH/CLOUDFLARE_SERVICE_TOKEN << 'SECRETEOF'
          ${{ secrets.CLOUDFLARE_SERVICE_TOKEN }}
          SECRETEOF
            chmod 600 $SECRETS_BACKUP_PATH/CLOUDFLARE_SERVICE_TOKEN
            echo '✅ Alternative Cloudflare Token backed up'
          "
        else
          echo "⏭️ Alternative Cloudflare Token not configured, skipping..."
        fi
    
    - name: Create Secrets Manifest
      run: |
        ssh thakii-server "
          set -e
          echo '📋 Creating secrets manifest...'
          cat > $SECRETS_BACKUP_PATH/MANIFEST.txt << 'EOF'
        GitHub Secrets Backup Manifest
        ================================
        Backup Date: \$(date -u '+%Y-%m-%d %H:%M:%S UTC')
        Backup Location: \$SECRETS_BACKUP_PATH
        
        Files Backed Up:
        ✓ THAKII_SSH_PRIVATE_KEY - SSH private key for authentication
        ✓ THAKII_SSH_PASSWORD - SSH/server access password (if configured)
        ✓ THAKII_CLOUDFLARE_SERVICE_TOKEN - Cloudflare service token (if configured)
        ✓ CLOUDFLARE_SERVICE_TOKEN - Alternative Cloudflare token (if configured)
        
        File Permissions:
        All secret files have 600 permissions (read/write for owner only)
        Directory has 700 permissions (owner only access)
        
        Security Notes:
        - These files contain sensitive credentials
        - Never share or commit these files to version control
        - Only the ec2-user should have access
        - Rotate tokens regularly for security
        
        Recovery Instructions:
        1. If secrets are lost, access this backup
        2. Copy files from \$SECRETS_BACKUP_PATH
        3. Use them to reconfigure GitHub secrets
        4. Update .env files on server if needed
        EOF
          chmod 600 $SECRETS_BACKUP_PATH/MANIFEST.txt
          echo '✅ Manifest created'
        "
    
    - name: Verify Backup Integrity
      run: |
        ssh thakii-server "
          set -e
          echo '🔍 Verifying backup integrity...'
          echo ''
          echo 'Files in backup directory:'
          ls -lah $SECRETS_BACKUP_PATH/
          echo ''
          echo 'File sizes:'
          du -h $SECRETS_BACKUP_PATH/*
          echo ''
          echo '✅ Backup verification complete'
        "
    
    - name: Create Recovery Instructions
      run: |
        ssh thakii-server "
          set -e
          echo '📝 Creating recovery instructions...'
          cat > $SECRETS_BACKUP_PATH/RECOVERY.md << 'EOF'
        # GitHub Secrets Recovery Guide
        
        ## Location
        Secrets are backed up to: \`\$SECRETS_BACKUP_PATH\`
        
        ## Available Secrets
        
        ### 1. THAKII_SSH_PRIVATE_KEY
        - **File**: THAKII_SSH_PRIVATE_KEY
        - **Purpose**: SSH private key for authentication
        - **Usage**: Used in GitHub Actions to SSH into the server
        - **Recovery**: 
          \`\`\`bash
          cat \$SECRETS_BACKUP_PATH/THAKII_SSH_PRIVATE_KEY
          \`\`\`
        
        ### 2. THAKII_SSH_PASSWORD (if present)
        - **File**: THAKII_SSH_PASSWORD
        - **Purpose**: SSH/server access password
        - **Usage**: Alternative authentication method
        - **Recovery**: 
          \`\`\`bash
          cat \$SECRETS_BACKUP_PATH/THAKII_SSH_PASSWORD
          \`\`\`
        
        ### 3. THAKII_CLOUDFLARE_SERVICE_TOKEN (if present)
        - **File**: THAKII_CLOUDFLARE_SERVICE_TOKEN
        - **Purpose**: Cloudflare service token
        - **Usage**: Cloudflare tunnel operations
        - **Recovery**: 
          \`\`\`bash
          cat \$SECRETS_BACKUP_PATH/THAKII_CLOUDFLARE_SERVICE_TOKEN
          \`\`\`
        
        ### 4. CLOUDFLARE_SERVICE_TOKEN (if present)
        - **File**: CLOUDFLARE_SERVICE_TOKEN
        - **Purpose**: Alternative Cloudflare token
        - **Usage**: Backup Cloudflare operations
        - **Recovery**: 
          \`\`\`bash
          cat \$SECRETS_BACKUP_PATH/CLOUDFLARE_SERVICE_TOKEN
          \`\`\`
        
        ## How to Restore Secrets to GitHub
        
        1. **Get secret value** from the backup file
        2. **Go to GitHub repository settings**
        3. **Navigate to**: Settings → Secrets and variables → Actions
        4. **Click**: "New repository secret"
        5. **Fill in**:
           - Name: The secret name (e.g., THAKII_SSH_PRIVATE_KEY)
           - Value: Content from the backup file
        6. **Click**: "Add secret"
        
        ## Security Best Practices
        
        ⚠️ **IMPORTANT**:
        - These files contain sensitive credentials
        - Ensure proper file permissions (600)
        - Never share or expose these values
        - Rotate tokens regularly
        - Keep this backup directory secure
        EOF
          chmod 600 $SECRETS_BACKUP_PATH/RECOVERY.md
          echo '✅ Recovery instructions created'
        "
    
    - name: Backup Complete - Summary
      run: |
        echo "✅ Secrets Backup Complete!"
        echo ""
        echo "📊 Summary:"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "Location: $SECRETS_BACKUP_PATH"
        echo "Server: $SERVER_HOST"
        echo ""
        echo "Documentation:"
        echo "  ✓ MANIFEST.txt - Backup information"
        echo "  ✓ RECOVERY.md - Recovery instructions"
        echo ""
        echo "🔐 Access:"
        echo "  SSH: ssh ec2-user@thakii-02.fds-1.com"
        echo "  Path: /home/ec2-user/github-secrets-backup"
        echo ""
        echo "⏰ Schedule: Daily at 2 AM UTC"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
