name: Check Actual Backend Logs

on:
  workflow_dispatch:

env:
  SERVER_HOST: thakii-02.fds-1.com
  SERVER_USER: ec2-user
  BACKEND_PATH: /home/ec2-user/thakii-backend-api

jobs:
  check_logs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Cloudflare Tunnel for SSH
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        mkdir -p ~/.ssh
        echo "${{ secrets.thakii_ssh_private_key }}" > ~/.ssh/thakii-key
        chmod 600 ~/.ssh/thakii-key
        
        echo "Host thakii-server" >> ~/.ssh/config
        echo "  HostName $SERVER_HOST" >> ~/.ssh/config
        echo "  User $SERVER_USER" >> ~/.ssh/config
        echo "  IdentityFile ~/.ssh/thakii-key" >> ~/.ssh/config
        echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
        echo "  StrictHostKeyChecking no" >> ~/.ssh/config
        chmod 600 ~/.ssh/config
    
    - name: Extract Actual Backend Logs
      run: |
        echo "📋 Extracting backend logs (treating as text with -a flag)..."
        ssh thakii-server "
          echo '=== Searching for video d860d117 ==='
          grep -a 'd860d117' /home/ec2-user/thakii-backend-api/systemd.log | tail -30
          
          echo ''
          echo '=== Searching for TRIGGER_WORKER_PROCESSING ==='
          grep -a 'TRIGGER_WORKER_PROCESSING' /home/ec2-user/thakii-backend-api/systemd.log | tail -20
          
          echo ''
          echo '=== Searching for UPLOAD ENDPOINT ==='
          grep -a 'UPLOAD ENDPOINT' /home/ec2-user/thakii-backend-api/systemd.log | tail -20
          
          echo ''
          echo '=== Searching for trigger_with_fallback ==='
          grep -a 'trigger_with_fallback' /home/ec2-user/thakii-backend-api/systemd.log | tail -10
        "
