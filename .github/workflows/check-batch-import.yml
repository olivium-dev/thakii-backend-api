name: Check and Restart Batch Import

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - restart_pending

env:
  SERVER_HOST: thakii-02.fds-1.com
  SERVER_USER: ec2-user

jobs:
  batch_import:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Cloudflare Tunnel for SSH
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        mkdir -p ~/.ssh
        echo "${{ secrets.thakii_ssh_private_key }}" > ~/.ssh/thakii-key
        chmod 600 ~/.ssh/thakii-key
        
        echo "Host thakii-server" >> ~/.ssh/config
        echo "  HostName $SERVER_HOST" >> ~/.ssh/config
        echo "  User $SERVER_USER" >> ~/.ssh/config
        echo "  IdentityFile ~/.ssh/thakii-key" >> ~/.ssh/config
        echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
        echo "  StrictHostKeyChecking no" >> ~/.ssh/config
        chmod 600 ~/.ssh/config
    
    - name: Check Batch Import Status
      if: ${{ github.event.inputs.action == 'status' }}
      run: |
        echo "📋 Checking batch import jobs..."
        ssh thakii-server "
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            SELECT job_id, status, total_videos, processed_videos, failed_videos, created_at 
            FROM batch_import_jobs 
            ORDER BY created_at DESC 
            LIMIT 5;
          \"
          echo ''
          echo '📋 Batch import videos status:'
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            SELECT biv.job_id, biv.video_name, biv.status, biv.video_id
            FROM batch_import_videos biv
            JOIN batch_import_jobs bij ON biv.job_id = bij.job_id
            WHERE bij.status IN ('pending', 'processing')
            ORDER BY biv.created_at DESC
            LIMIT 20;
          \"
          echo ''
          echo '📋 Video tasks status:'
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            SELECT status, COUNT(*) FROM video_tasks GROUP BY status ORDER BY status;
          \"
        "
    
    - name: Restart Pending Batch Jobs
      if: ${{ github.event.inputs.action == 'restart_pending' }}
      run: |
        echo "🔄 Restarting pending batch import jobs..."
        ssh thakii-server "
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            UPDATE batch_import_jobs 
            SET status = 'pending', processed_videos = 0, failed_videos = 0
            WHERE status = 'processing';
          \"
          echo '✅ Jobs reset to pending'
          
          echo ''
          echo '📋 Current job status:'
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            SELECT job_id, status, total_videos, share_url FROM batch_import_jobs WHERE status = 'pending';
          \"
        "
