name: Check Specific Video Logs

on:
  workflow_dispatch:

env:
  SERVER_HOST: thakii-02.fds-1.com
  SERVER_USER: ec2-user
  BACKEND_PATH: /home/ec2-user/ThakiiBackend.Api

jobs:
  check_logs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Setup SSH
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        mkdir -p ~/.ssh
        echo "${{ secrets.thakii_ssh_private_key }}" > ~/.ssh/thakii-key
        chmod 600 ~/.ssh/thakii-key
        
        echo "Host thakii-server" >> ~/.ssh/config
        echo "  HostName $SERVER_HOST" >> ~/.ssh/config
        echo "  User $SERVER_USER" >> ~/.ssh/config
        echo "  IdentityFile ~/.ssh/thakii-key" >> ~/.ssh/config
        echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
        echo "  StrictHostKeyChecking no" >> ~/.ssh/config
        chmod 600 ~/.ssh/config
    
    - name: Check Backend Logs for Specific Video
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
      run: |
        ssh thakii-server "
          LOG=$BACKEND_PATH/systemd.log
          (test -f \$LOG) || { echo 'Using journalctl'; LOG=''; }
          echo '=== CHECKING LOGS FOR VIDEO d52f6288-0bfb-468e-8eb9-a0d2142620ec ==='
          grep -a 'd52f6288-0bfb-468e-8eb9-a0d2142620ec' \$LOG 2>/dev/null | tail -20 || sudo journalctl -u thakii-backend -n 200 --no-pager | grep -a 'd52f6288' || true
          echo '=== TRIGGER / Worker / Upload ==='
          grep -aE 'TRIGGER_WORKER|UPLOAD|Worker Manager|Primary Worker|Fallback' \$LOG 2>/dev/null | tail -20 || sudo journalctl -u thakii-backend -n 100 --no-pager | grep -aE 'Worker|Upload|Trigger' || true
        "
