name: Deploy Backend to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVER_HOST: thakii-02.fds-1.com
  SERVER_USER: ec2-user
  BACKEND_PATH: /home/ec2-user/thakii-backend-api

jobs:
  deploy:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Test SSH Connection FIRST
      uses: ./.github/actions/cloudflare-ssh
      with:
        ssh-private-key: ${{ secrets.THAKII_SSH_PRIVATE_KEY }}
        server-hostname: ${{ env.SERVER_HOST }}
        server-user: ${{ env.SERVER_USER }}
        host-alias: 'thakii-server-test'
    
    - name: Setup SSH Connection via Cloudflare
      uses: ./.github/actions/cloudflare-ssh
      with:
        ssh-private-key: ${{ secrets.THAKII_SSH_PRIVATE_KEY }}
        server-hostname: ${{ env.SERVER_HOST }}
        server-user: ${{ env.SERVER_USER }}
        host-alias: 'thakii-server'
    
    - name: Emergency Disk Cleanup
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
      run: |
        echo "🧹 Running emergency disk cleanup..."
        ssh thakii-server "
          set -e
          echo '=== EMERGENCY DISK CLEANUP ==='
          
          echo 'Before cleanup:'
          df -h
          
          echo ''
          echo 'Cleaning /tmp directory...'
          
          # Clean up failed backup attempts
          sudo find /tmp -maxdepth 1 -name 'backend-backup-*' -type d -exec rm -rf {} + 2>/dev/null || true
          echo '✅ Removed backup directories'
          
          # Clean up old video files
          sudo find /tmp -name '*.mp4' -type f -mtime +0 -delete 2>/dev/null || true
          sudo find /tmp -name '*.pdf' -type f -mtime +0 -delete 2>/dev/null || true
          echo '✅ Removed old video/PDF files'
          
          # Clean up worker temp files
          sudo rm -rf /tmp/thakii-worker/* 2>/dev/null || true
          sudo rm -rf /tmp/tmp* 2>/dev/null || true
          echo '✅ Removed worker temp files'
          
          # Clean up any other large temp files
          sudo find /tmp -type f -size +10M -mtime +0 -delete 2>/dev/null || true
          echo '✅ Removed large temp files'
          
          echo ''
          echo 'After cleanup:'
          df -h
          
          echo ''
          echo '🎉 Disk cleanup complete!'
        "
    
    - name: Deploy Backend via Git Pull
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
      run: |
        ssh thakii-server "
          set -e
          
          echo '=== Deploying Backend API (No Backup) ==='
          
          # Navigate to backend directory
          cd $BACKEND_PATH
          
          # Skip backup to avoid disk space issues
          echo \"⚠️ Skipping backup due to disk space constraints\"
          
          # Pull latest changes
          echo '📥 Pulling latest code...'
          git fetch origin
          git reset --hard origin/main
          
          # Activate virtual environment and install dependencies
          echo '📦 Installing dependencies...'
          source venv/bin/activate
          pip install -q -r requirements.txt
          
          # Restart backend service
          echo '🔄 Restarting backend service...'
          sudo systemctl restart thakii-backend.service
          
          # Wait for service to start
          sleep 3
          
          # Check service status
          sudo systemctl is-active thakii-backend.service || (
            echo '❌ Service failed to start'
            sudo systemctl status thakii-backend.service
            exit 1
          )
          
          echo '✅ Backend deployment complete'
        "
    
    - name: Verify Backend Health
      run: |
        # Wait for backend to fully start
        sleep 5
        
        echo "🔍 Checking backend health..."
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://thakii-02.fanusdigital.site/thakii-be/health)
        
        if [ "$HTTP_CODE" -eq 200 ]; then
          echo "✅ Backend is healthy (HTTP $HTTP_CODE)"
        else
          echo "⚠️  Backend health check failed (HTTP $HTTP_CODE)"
          exit 1
        fi
    
    - name: Notify deployment status
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ Backend deployment successful"
        else
          echo "❌ Backend deployment failed"
        fi
