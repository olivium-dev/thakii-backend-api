name: Deploy Backend to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVER_HOST: thakii-02.fds-1.com
  SERVER_USER: ec2-user
  BACKEND_PATH: /home/ec2-user/thakii-backend-api

jobs:
  deploy:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Test SSH Connection FIRST
      uses: ./.github/actions/cloudflare-ssh
      with:
        ssh-private-key: ${{ secrets.THAKII_SSH_PRIVATE_KEY }}
        server-hostname: ${{ env.SERVER_HOST }}
        server-user: ${{ env.SERVER_USER }}
        host-alias: 'thakii-server-test'
    
    - name: Setup SSH Connection via Cloudflare
      uses: ./.github/actions/cloudflare-ssh
      with:
        ssh-private-key: ${{ secrets.THAKII_SSH_PRIVATE_KEY }}
        server-hostname: ${{ env.SERVER_HOST }}
        server-user: ${{ env.SERVER_USER }}
        host-alias: 'thakii-server'
    
    - name: Emergency Disk Cleanup
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
      run: |
        echo "🧹 Running emergency disk cleanup..."
        ssh thakii-server "
          set -e
          echo '=== EMERGENCY DISK CLEANUP ==='
          
          echo 'Before cleanup:'
          df -h
          
          echo ''
          echo 'Cleaning /tmp directory...'
          
          # Clean up failed backup attempts
          sudo find /tmp -maxdepth 1 -name 'backend-backup-*' -type d -exec rm -rf {} + 2>/dev/null || true
          echo '✅ Removed backup directories'
          
          # Clean up old video files
          sudo find /tmp -name '*.mp4' -type f -mtime +0 -delete 2>/dev/null || true
          sudo find /tmp -name '*.pdf' -type f -mtime +0 -delete 2>/dev/null || true
          echo '✅ Removed old video/PDF files'
          
          # Clean up worker temp files
          sudo rm -rf /tmp/thakii-worker/* 2>/dev/null || true
          sudo rm -rf /tmp/tmp* 2>/dev/null || true
          echo '✅ Removed worker temp files'
          
          # Clean up any other large temp files
          sudo find /tmp -type f -size +10M -mtime +0 -delete 2>/dev/null || true
          echo '✅ Removed large temp files'
          
          echo ''
          echo 'After cleanup:'
          df -h
          
          echo ''
          echo '🎉 Disk cleanup complete!'
        "
    
    - name: Deploy Backend via Git Pull
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
      run: |
        ssh thakii-server "
          set -e
          
          echo '=== Deploying Backend API (No Backup) ==='
          
          # Navigate to backend directory
          cd $BACKEND_PATH
          
          # Skip backup to avoid disk space issues
          echo \"⚠️ Skipping backup due to disk space constraints\"
          
          # Pull latest changes
          echo '📥 Pulling latest code...'
          git fetch origin
          git reset --hard origin/main
          
          # Activate virtual environment and install dependencies
          echo '📦 Installing dependencies...'
          source venv/bin/activate
          pip install -q -r requirements.txt
          
          echo '🔧 Applying database migrations for Worker API...'
          # Apply database migration for worker assignment columns
          if [ -f scripts/add_worker_assignment_columns.sql ]; then
            PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -f scripts/add_worker_assignment_columns.sql && echo '✅ Database migration applied' || echo '⚠️ Database migration failed or already applied'
          fi
          
          echo '🔧 Configuring worker environment variables...'
          # Ensure .env file exists
          touch .env
          
          # Add worker URLs if not already present
          if ! grep -q 'PRIMARY_WORKER_URL' .env; then
            echo 'Adding worker URLs to .env file'
            echo 'PRIMARY_WORKER_URL=https://thakii-3.fanusdigital.site/thakii-worker' >> .env
            echo 'FALLBACK_WORKER_URL=https://thakii-02.fanusdigital.site/thakii-worker' >> .env
            echo 'WORKER_PRIORITY_MODE=primary-with-fallback' >> .env
          else
            echo 'Updating existing worker URLs'
            # Update existing values to ensure they're correct
            sed -i 's|PRIMARY_WORKER_URL=.*|PRIMARY_WORKER_URL=https://thakii-3.fanusdigital.site/thakii-worker|' .env
            sed -i 's|FALLBACK_WORKER_URL=.*|FALLBACK_WORKER_URL=https://thakii-02.fanusdigital.site/thakii-worker|' .env
            sed -i 's|WORKER_PRIORITY_MODE=.*|WORKER_PRIORITY_MODE=primary-with-fallback|' .env
          fi
          
          # Add Worker API configuration if not already present
          if ! grep -q 'ENABLE_WORKER_API' .env; then
            echo 'Adding Worker API configuration to .env file'
            echo 'ENABLE_WORKER_API=false' >> .env
            echo 'WORKER_HEARTBEAT_TIMEOUT=300' >> .env
          fi
          
          # Verify configuration
          echo 'Worker configuration:'
          grep -E 'PRIMARY_WORKER_URL|FALLBACK_WORKER_URL|WORKER_PRIORITY_MODE|ENABLE_WORKER_API' .env || echo 'Warning: Worker configuration not found'
          
          # Configure systemd service to load .env file
          echo '🔧 Configuring systemd service to load .env file...'
          
          # Check if EnvironmentFile is already in the service file
          if ! sudo grep -q 'EnvironmentFile=' /etc/systemd/system/thakii-backend.service; then
            echo 'Adding EnvironmentFile to systemd service...'
            
            # Create a backup of the service file
            sudo cp /etc/systemd/system/thakii-backend.service /etc/systemd/system/thakii-backend.service.backup
            
            # Add EnvironmentFile directive after [Service] section
            sudo sed -i '/^\[Service\]/a EnvironmentFile=/home/ec2-user/thakii-backend-api/.env' /etc/systemd/system/thakii-backend.service
            
            echo '✅ Added EnvironmentFile to systemd service'
          else
            echo '✅ EnvironmentFile already configured in systemd service'
          fi
          
          # Reload systemd configuration
          echo '🔄 Reloading systemd configuration...'
          sudo systemctl daemon-reload
          
          # Restart backend service
          echo '🔄 Restarting backend service...'
          sudo systemctl restart thakii-backend.service
          
          # Wait for service to start
          sleep 3
          
          # Check service status
          sudo systemctl is-active thakii-backend.service || (
            echo '❌ Service failed to start'
            sudo systemctl status thakii-backend.service
            exit 1
          )
          
          echo '✅ Backend deployment complete'
        "
    
    - name: Reset Stuck Videos
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
      run: |
        echo "🔧 Resetting stuck processing videos..."
        ssh thakii-server "
          set -e
          cd $BACKEND_PATH
          
          echo '=== RESET STUCK VIDEOS ==='
          
          # Reset videos stuck in processing state
          echo '🔄 Resetting videos stuck in processing state (>30 min)...'
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            UPDATE video_tasks 
            SET status = 'in_queue',
                error_message = 'Reset from processing state after worker configuration fix',
                updated_at = NOW()
            WHERE status = 'processing' 
              AND updated_at < NOW() - INTERVAL '30 minutes';
          \" && echo '✅ Reset complete' || echo '⚠️ Could not reset processing videos'
          
          # Count videos in queue to be processed
          echo ''
          echo '📊 Current queue status:'
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            SELECT status, COUNT(*) as count FROM video_tasks 
            WHERE status IN ('in_queue', 'processing', 'failed') 
            GROUP BY status ORDER BY count DESC;
          \" || echo '⚠️ Could not check queue status'
          
          echo '🎉 Stuck video reset complete!'
        "
    
    - name: Verify Backend Health and Worker Configuration
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
      run: |
        # Wait for backend to fully start
        sleep 5
        
        echo "🔍 Checking backend health..."
        HEALTH_RESPONSE=$(curl -s https://thakii-02.fanusdigital.site/thakii-be/health)
        HTTP_CODE=$?
        
        if [ $HTTP_CODE -eq 0 ] && [ ! -z "$HEALTH_RESPONSE" ]; then
          echo "✅ Backend is healthy"
          echo "$HEALTH_RESPONSE" | jq '.'
          
          # Extract and verify worker status
          echo ""
          echo "🔍 Verifying worker health from backend..."
          echo "$HEALTH_RESPONSE" | jq '.workers' || echo "⚠️ Worker status not available"
          
          # Check if primary worker is healthy
          PRIMARY_STATUS=$(echo "$HEALTH_RESPONSE" | jq -r '.workers.primary.status // "unknown"')
          echo "Primary Worker Status: $PRIMARY_STATUS"
          
          if [ "$PRIMARY_STATUS" != "healthy" ]; then
            echo "⚠️ Primary worker (thakii-03) is not healthy"
            
            # Check fallback worker
            FALLBACK_STATUS=$(echo "$HEALTH_RESPONSE" | jq -r '.workers.fallback.status // "unknown"')
            echo "Fallback Worker Status: $FALLBACK_STATUS"
            
            if [ "$FALLBACK_STATUS" != "healthy" ]; then
              echo "❌ Both workers are unhealthy!"
              exit 1
            else
              echo "✅ Fallback worker (thakii-02) is available"
            fi
          else
            echo "✅ Primary worker (thakii-03) is healthy"
          fi
        else
          echo "⚠️  Backend health check failed"
          exit 1
        fi
        
        echo ""
        echo "🔍 Verifying worker manager configuration..."
        ssh thakii-server "
          set -e
          cd $BACKEND_PATH
          
          # Check systemd service configuration
          echo 'Checking systemd service configuration:'
          sudo systemctl show thakii-backend.service --property=EnvironmentFiles || echo 'No EnvironmentFiles configured'
          
          # Check backend logs for worker manager initialization
          echo 'Checking backend logs for worker configuration:'
          sudo journalctl -u thakii-backend.service --no-pager -n 50 | grep -E 'Worker Manager initialized|Primary Worker:|Fallback Worker:' || echo 'Worker manager logs not found'
          
          # Check .env file for worker configuration
          echo 'Checking .env file for worker URLs:'
          grep -E 'PRIMARY_WORKER_URL|FALLBACK_WORKER_URL|WORKER_PRIORITY_MODE' .env || echo 'Worker URLs not found in .env'
          
          # Test if environment variables are actually loaded by the service
          echo 'Testing if backend can access worker environment variables:'
          source venv/bin/activate
          python3 -c 'import sys; sys.path.append(\".\"); from core.worker_manager import worker_manager; print(f\"Primary: {worker_manager.primary_worker_url or \"NOT SET\"}\"); print(f\"Fallback: {worker_manager.fallback_worker_url or \"NOT SET\"}\")' || echo '⚠️ Could not test worker manager configuration'
        "
    
    - name: Test Worker Triggering and Health
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
      run: |
        echo "🧪 Testing worker triggering and comprehensive health..."
        ssh thakii-server "
          set -e
          cd $BACKEND_PATH
          
          echo '=== WORKER HEALTH CHECK ==='
          echo 'Checking if workers are accessible from backend...'
          
          # Test primary worker with detailed checks
          echo '🔍 Primary Worker (thakii-03):'
          PRIMARY_HEALTH=\$(curl -s https://thakii-3.fanusdigital.site/thakii-worker/health)
          if [ ! -z \"\$PRIMARY_HEALTH\" ]; then
            echo \"\$PRIMARY_HEALTH\" | jq '{status, database, storage, ffmpeg: .ffmpeg.installed, queue}' || echo 'Primary worker response invalid'
          else
            echo '❌ Primary worker unreachable'
          fi
          
          echo ''
          echo '🔍 Fallback Worker (thakii-02):'
          FALLBACK_HEALTH=\$(curl -s https://thakii-02.fanusdigital.site/thakii-worker/health)
          if [ ! -z \"\$FALLBACK_HEALTH\" ]; then
            echo \"\$FALLBACK_HEALTH\" | jq '{status, database, storage}' || echo 'Fallback worker response invalid'
          else
            echo '❌ Fallback worker unreachable'
          fi
          
          echo ''
          echo '✅ Worker health check complete'
        "

    - name: Notify deployment status
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ Backend deployment successful with worker configuration fixed!"
          echo "🎉 The video processing pipeline has been restored!"
        else
          echo "❌ Backend deployment failed"
        fi
