name: Deploy Backend to Server

on:
  push:
    branches:
      - main
      - feature/postgres-migration
  workflow_dispatch:

env:
  SERVER_HOST: vps-71.fds-1.com
  SERVER_USER: ec2-user
  DEPLOY_PATH: /home/ec2-user/thakii-backend-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install curl and jq
        run: |
          sudo apt-get update && sudo apt-get install -y curl jq
      
      - name: Deploy to server
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          # Deploy backend via webhook
          echo "=== Deploying Backend via Webhook ==="
          
          RESPONSE=$(curl -s -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            https://thakii-02.fanusdigital.site/webhook/deploy/backend)
          
          HTTP_CODE="${RESPONSE: -3}"
          BODY="${RESPONSE%???}"
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Backend deployment successful"
          else
            echo "❌ Backend deployment failed"
            exit 1
          fi
      
      - name: Verify deployment
        run: |
          # Wait for service to be ready
          sleep 10
          
          # Check health endpoint via HTTPS
          echo "=== Verifying Backend Health ==="
          HEALTH_CHECK=$(curl -s https://thakii-02.fanusdigital.site/thakii-be/health | jq -r '.status')
          
          echo "Health check response: $HEALTH_CHECK"
          
          if [ "$HEALTH_CHECK" == "healthy" ]; then
            echo "✅ Backend is healthy"
          else
            echo "❌ Backend health check failed"
            exit 1
          fi
      
      - name: Notify deployment status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
          fi

