name: Deploy Backend to Server

on:
  push:
    branches:
      - main
      - feature/postgres-migration
  workflow_dispatch:

env:
  SERVER_HOST: vps-71.fds-1.com
  SERVER_USER: ec2-user
  DEPLOY_PATH: /home/ec2-user/thakii-backend-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup SSH Connection via Cloudflare
        uses: ./.github/actions/cloudflare-ssh
        with:
          ssh-password: ${{ secrets.SERVER_PASSWORD }}
          server-hostname: ${{ env.SERVER_HOST }}
          server-user: ${{ env.SERVER_USER }}
          host-alias: 'thakii-server'
      
      - name: Deploy to server
        env:
          SSH_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh thakii-server << EOF
            set -e
            
            echo "=== Deploying Backend API ==="
            cd $DEPLOY_PATH || exit 1
            
            # Get current branch name
            BRANCH_NAME=\$(git rev-parse --abbrev-ref HEAD)
            echo "Current branch: \$BRANCH_NAME"
            
            # Fetch and pull latest changes
            git fetch origin
            git pull origin \$BRANCH_NAME
            
            # Install dependencies
            pip3 install --user -r requirements.txt
            
            # Restart service
            sudo systemctl restart thakii-backend
            
            # Check service status
            sleep 3
            sudo systemctl status thakii-backend --no-pager
            
            echo "=== Backend deployment complete ==="
          EOF
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
      
      - name: Verify deployment
        run: |
          # Wait for service to be ready
          sleep 10
          
          # Check health endpoint via HTTPS
          echo "=== Verifying Backend Health ==="
          HEALTH_CHECK=$(curl -s https://thakii-02.fanusdigital.site/thakii-be/health | jq -r '.status')
          
          echo "Health check response: $HEALTH_CHECK"
          
          if [ "$HEALTH_CHECK" == "healthy" ]; then
            echo "✅ Backend is healthy"
          else
            echo "❌ Backend health check failed"
            exit 1
          fi
      
      - name: Notify deployment status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
          fi
