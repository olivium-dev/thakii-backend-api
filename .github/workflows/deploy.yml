name: Deploy Backend to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVER_HOST: thakii-02.fds-1.com
  SERVER_USER: ec2-user
  BACKEND_PATH: /home/ec2-user/thakii-backend-api

jobs:
  deploy:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Test SSH Connection FIRST
      uses: ./.github/actions/cloudflare-ssh
      with:
        ssh-private-key: ${{ secrets.THAKII_SSH_PRIVATE_KEY }}
        server-hostname: ${{ env.SERVER_HOST }}
        server-user: ${{ env.SERVER_USER }}
        host-alias: 'thakii-server-test'
    
    - name: Setup SSH Connection via Cloudflare
      uses: ./.github/actions/cloudflare-ssh
      with:
        ssh-private-key: ${{ secrets.THAKII_SSH_PRIVATE_KEY }}
        server-hostname: ${{ env.SERVER_HOST }}
        server-user: ${{ env.SERVER_USER }}
        host-alias: 'thakii-server'
    
    - name: Emergency Disk Cleanup
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
      run: |
        echo "🧹 Running emergency disk cleanup..."
        ssh thakii-server "
          set -e
          echo '=== EMERGENCY DISK CLEANUP ==='
          
          echo 'Before cleanup:'
          df -h
          
          echo ''
          echo 'Cleaning /tmp directory...'
          
          # Clean up failed backup attempts
          sudo find /tmp -maxdepth 1 -name 'backend-backup-*' -type d -exec rm -rf {} + 2>/dev/null || true
          echo '✅ Removed backup directories'
          
          # Clean up old video files
          sudo find /tmp -name '*.mp4' -type f -mtime +0 -delete 2>/dev/null || true
          sudo find /tmp -name '*.pdf' -type f -mtime +0 -delete 2>/dev/null || true
          echo '✅ Removed old video/PDF files'
          
          # Clean up worker temp files
          sudo rm -rf /tmp/thakii-worker/* 2>/dev/null || true
          sudo rm -rf /tmp/tmp* 2>/dev/null || true
          echo '✅ Removed worker temp files'
          
          # Clean up any other large temp files
          sudo find /tmp -type f -size +10M -mtime +0 -delete 2>/dev/null || true
          echo '✅ Removed large temp files'
          
          echo ''
          echo 'After cleanup:'
          df -h
          
          echo ''
          echo '🎉 Disk cleanup complete!'
        "
    
    - name: Deploy Backend via Git Pull
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
      run: |
        ssh thakii-server "
          set -e
          
          echo '=== Deploying Backend API (No Backup) ==='
          
          # Navigate to backend directory
          cd $BACKEND_PATH
          
          # Skip backup to avoid disk space issues
          echo \"⚠️ Skipping backup due to disk space constraints\"
          
          # Pull latest changes
          echo '📥 Pulling latest code...'
          git fetch origin
          git reset --hard origin/main
          
          # Activate virtual environment and install dependencies
          echo '📦 Installing dependencies...'
          source venv/bin/activate
          pip install -q -r requirements.txt
          
          echo '🔧 Configuring worker environment variables...'
          # Ensure .env file exists
          touch .env
          
          # Add worker URLs if not already present
          if ! grep -q 'PRIMARY_WORKER_URL' .env; then
            echo 'Adding worker URLs to .env file'
            echo 'PRIMARY_WORKER_URL=https://thakii-3.fanusdigital.site/thakii-worker' >> .env
            echo 'FALLBACK_WORKER_URL=https://thakii-02.fanusdigital.site/thakii-worker' >> .env
            echo 'WORKER_PRIORITY_MODE=primary-with-fallback' >> .env
          else
            echo 'Updating existing worker URLs'
            # Update existing values to ensure they're correct
            sed -i 's|PRIMARY_WORKER_URL=.*|PRIMARY_WORKER_URL=https://thakii-3.fanusdigital.site/thakii-worker|' .env
            sed -i 's|FALLBACK_WORKER_URL=.*|FALLBACK_WORKER_URL=https://thakii-02.fanusdigital.site/thakii-worker|' .env
            sed -i 's|WORKER_PRIORITY_MODE=.*|WORKER_PRIORITY_MODE=primary-with-fallback|' .env
          fi
          
          # Verify configuration
          echo 'Worker configuration:'
          grep -E 'PRIMARY_WORKER_URL|FALLBACK_WORKER_URL|WORKER_PRIORITY_MODE' .env || echo 'Warning: Worker configuration not found'
          
          # Restart backend service
          echo '🔄 Restarting backend service...'
          sudo systemctl restart thakii-backend.service
          
          # Wait for service to start
          sleep 3
          
          # Check service status
          sudo systemctl is-active thakii-backend.service || (
            echo '❌ Service failed to start'
            sudo systemctl status thakii-backend.service
            exit 1
          )
          
          echo '✅ Backend deployment complete'
        "
    
    - name: Run Automated Recovery System
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
      run: |
        echo "🔧 Running automated recovery system..."
        ssh thakii-server "
          set -e
          cd $BACKEND_PATH
          
          echo '=== AUTOMATED RECOVERY SYSTEM ==='
          
          # Activate virtual environment
          source venv/bin/activate
          
          # Run recovery system in dry-run mode first
          echo '🧪 Running recovery system in dry-run mode...'
          python3 scripts/auto_recovery.py --dry-run --output /tmp/recovery_dry_run.json
          
          # Show dry-run results
          echo '📊 Dry-run results:'
          cat /tmp/recovery_dry_run.json | jq '.statistics'
          
          # Check if any stuck videos were found
          STUCK_COUNT=\$(cat /tmp/recovery_dry_run.json | jq '.statistics.stuck_videos_found')
          FAILED_COUNT=\$(cat /tmp/recovery_dry_run.json | jq '.statistics.failed_videos_cleaned')
          
          if [ \"\$STUCK_COUNT\" -gt 0 ] || [ \"\$FAILED_COUNT\" -gt 0 ]; then
            echo \"⚠️ Found \$STUCK_COUNT stuck videos and \$FAILED_COUNT old failed videos\"
            echo '🔄 Running recovery system in live mode...'
            python3 scripts/auto_recovery.py --output /tmp/recovery_live.json
            
            echo '📊 Live recovery results:'
            cat /tmp/recovery_live.json | jq '.statistics'
          else
            echo '✅ No stuck or failed videos found - system is healthy'
          fi
          
          # Reset stuck videos in processing state
          echo ''
          echo '🔄 Resetting videos stuck in processing state...'
          psql -U thakii_user -d thakii_production -c \"
            UPDATE video_tasks 
            SET status = 'in_queue',
                error_message = 'Reset from processing state after worker configuration fix',
                updated_at = NOW()
            WHERE status = 'processing' 
              AND updated_at < NOW() - INTERVAL '30 minutes';
          \" || echo '⚠️ Could not reset processing videos - database access issue'
          
          # Count videos in queue to be processed
          echo ''
          echo '📊 Current queue status:'
          psql -U thakii_user -d thakii_production -c \"
            SELECT status, COUNT(*) FROM video_tasks 
            WHERE status IN ('in_queue', 'processing', 'failed') 
            GROUP BY status ORDER BY COUNT(*) DESC;
          \" || echo '⚠️ Could not check queue status'
          
          echo '🎉 Automated recovery complete!'
        "
    
    - name: Send Critical Alerts
      if: always()
      env:
        BACKEND_PATH: ${{ env.BACKEND_PATH }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        echo "📢 Checking for critical alerts..."
        ssh thakii-server "
          set -e
          cd $BACKEND_PATH
          
          echo '=== CRITICAL ALERT SYSTEM ==='
          
          # Activate virtual environment
          source venv/bin/activate
          
          # Install alerting dependencies
          pip install requests
          
          # Send alerts based on recovery results
          if [ -f /tmp/recovery_live.json ]; then
            echo '📢 Analyzing recovery results for alerts...'
            python3 scripts/alert_system.py --recovery-report /tmp/recovery_live.json --output /tmp/alert_report.json
            
            echo '📊 Alert system results:'
            cat /tmp/alert_report.json | jq '.statistics'
          elif [ -f /tmp/recovery_dry_run.json ]; then
            echo '📢 Analyzing dry-run results for potential alerts...'
            python3 scripts/alert_system.py --dry-run --recovery-report /tmp/recovery_dry_run.json --output /tmp/alert_report.json
          else
            echo '✅ No recovery reports to analyze'
          fi
          
          echo '🎉 Alert system complete!'
        "
    
    - name: Verify Backend Health and Worker Configuration
      run: |
        # Wait for backend to fully start
        sleep 5
        
        echo "🔍 Checking backend health..."
        HEALTH_RESPONSE=$(curl -s https://thakii-02.fanusdigital.site/thakii-be/health)
        HTTP_CODE=$?
        
        if [ $HTTP_CODE -eq 0 ] && [ ! -z "$HEALTH_RESPONSE" ]; then
          echo "✅ Backend is healthy"
          echo "$HEALTH_RESPONSE" | jq '.'
        else
          echo "⚠️  Backend health check failed"
          exit 1
        fi
        
        echo ""
        echo "🔍 Verifying worker manager configuration..."
        ssh thakii-server "
          set -e
          cd $BACKEND_PATH
          
          # Check backend logs for worker manager initialization
          echo 'Checking backend logs for worker configuration:'
          sudo journalctl -u thakii-backend.service --no-pager -n 50 | grep -E 'Worker Manager initialized|Primary Worker:|Fallback Worker:' || echo 'Worker manager logs not found'
          
          # Test worker triggering by checking if the function is working
          echo 'Checking worker trigger function:'
          source venv/bin/activate
          python3 -c '
import sys
sys.path.append(\".\")
try:
    from core.worker_manager import worker_manager
    print(f\"Worker Manager Configuration:\\n- Primary: {worker_manager.primary_worker_url or \"NOT SET\"}\\n- Fallback: {worker_manager.fallback_worker_url or \"NOT SET\"}\\n- Mode: {worker_manager.priority_mode}\")
    if not worker_manager.primary_worker_url and not worker_manager.fallback_worker_url:
        print(\"❌ ERROR: No worker URLs configured!\")
        sys.exit(1)
    else:
        print(\"✅ Worker manager properly configured\")
except Exception as e:
    print(f\"❌ ERROR: {str(e)}\")
    sys.exit(1)
'
        "
    
    - name: Test Worker Triggering
      run: |
        echo "🧪 Testing worker triggering with a test video..."
        ssh thakii-server "
          set -e
          cd $BACKEND_PATH
          source venv/bin/activate
          
          echo '=== WORKER TRIGGER TEST ==='
          
          # Create a test script to verify worker triggering
          cat > /tmp/test_worker_trigger.py << 'EOF'
import os
import sys
import uuid
import json
from datetime import datetime

# Add the current directory to the path to import modules
sys.path.append('.')

try:
    # Import required modules
    from core.worker_manager import worker_manager
    
    # Generate a test video ID
    test_video_id = f'test-{uuid.uuid4()}'
    
    # Create test payload
    payload = {
        'video_id': test_video_id,
        'user_id': 'github-actions-test',
        'filename': 'test-worker-trigger.mp4',
        's3_key': f'videos/{test_video_id}/test-worker-trigger.mp4'
    }
    
    print(f'🧪 Testing worker trigger with video ID: {test_video_id}')
    print(f'📊 Worker Manager Configuration:')
    print(f'- Primary Worker: {worker_manager.primary_worker_url or \"NOT SET\"}')
    print(f'- Fallback Worker: {worker_manager.fallback_worker_url or \"NOT SET\"}')
    print(f'- Priority Mode: {worker_manager.priority_mode}')
    
    # Trigger worker processing
    print(f'🚀 Triggering worker...')
    result = worker_manager.trigger_with_fallback(payload)
    
    # Print result
    print(f'📊 Result:')
    print(json.dumps(result, indent=2))
    
    if result['success']:
        print(f'✅ Worker trigger successful!')
        print(f'- Worker used: {result[\"worker_used\"]}')
        print(f'- Worker URL: {result.get(\"worker_url\", \"N/A\")}')
        print(f'- Status code: {result.get(\"status_code\", \"N/A\")}')
        sys.exit(0)
    else:
        print(f'❌ Worker trigger failed!')
        print(f'- Error: {result.get(\"error\", \"Unknown error\")}')
        sys.exit(1)
        
except Exception as e:
    print(f'❌ Test failed with error: {str(e)}')
    sys.exit(1)
EOF
          
          # Run the test script
          python3 /tmp/test_worker_trigger.py
        "

    - name: Notify deployment status
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ Backend deployment successful with worker configuration fixed!"
          echo "🎉 The video processing pipeline has been restored!"
        else
          echo "❌ Backend deployment failed"
        fi
