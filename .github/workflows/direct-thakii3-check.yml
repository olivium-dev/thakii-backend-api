name: Direct thakii-3 Check

on:
  workflow_dispatch:

jobs:
  check_thakii3:
    runs-on: ubuntu-latest
    
    steps:
    - name: Setup Cloudflare
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        sudo apt-get update && sudo apt-get install -y sshpass
    
    - name: Direct SSH Check of thakii-3 PostgreSQL Tunnel
      run: |
        echo "🔍 DIRECT CHECK OF THAKII-3 POSTGRESQL TUNNEL"
        echo "============================================="
        
        # Use the password we know works
        sshpass -p "12344321" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          -o ProxyCommand="cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site" \
          fanusdigital@ssh-thakii-3.fanusdigital.site "
          
          echo '=== SYSTEM INFO ==='
          echo 'Current user:' \$(whoami)
          echo 'Current directory:' \$(pwd)
          echo 'Date:' \$(date)
          
          echo ''
          echo '=== CHECKING CLOUDFLARE TUNNEL PROCESS ==='
          ps aux | grep 'cloudflared' | grep -v grep || echo 'No cloudflared processes found'
          
          echo ''
          echo '=== CHECKING PORT 15432 ==='
          lsof -i :15432 || echo 'Port 15432 not in use'
          
          echo ''
          echo '=== TESTING PORT CONNECTIVITY ==='
          nc -z localhost 15432 && echo '✅ Port 15432 is accessible' || echo '❌ Port 15432 is NOT accessible'
          
          echo ''
          echo '=== CHECKING TUNNEL LOG ==='
          if [ -f /tmp/postgres_tunnel.log ]; then
            echo 'Tunnel log exists. Last 10 lines:'
            tail -10 /tmp/postgres_tunnel.log
          else
            echo 'No tunnel log found at /tmp/postgres_tunnel.log'
          fi
          
          echo ''
          echo '=== CHECKING MONITOR SCRIPT ==='
          if [ -f ~/monitor_postgres_tunnel.sh ]; then
            echo 'Monitor script exists. Running status check:'
            ~/monitor_postgres_tunnel.sh status
          else
            echo 'Monitor script not found'
          fi
          
          echo ''
          echo '=== CHECKING LAUNCHD SERVICE ==='
          launchctl list | grep 'postgres' || echo 'No postgres-related LaunchDaemon found'
          
          echo ''
          echo '=== TESTING POSTGRESQL CONNECTION ==='
          echo 'Attempting PostgreSQL connection via tunnel...'
          PGPASSWORD='P@ssw0rd768_DB' psql -h localhost -p 15432 -U thakii_user -d thakii_production -c 'SELECT NOW() as current_time;' 2>&1 || echo 'PostgreSQL connection failed'
          
          echo ''
          echo '=== CHECKING WORKER STATUS ==='
          ps aux | grep 'python.*api_server' | grep -v grep || echo 'Worker not running'
          
          echo ''
          echo '=== ATTEMPTING TO START TUNNEL MANUALLY ==='
          echo 'Trying to start tunnel manually...'
          pkill -f 'cloudflared.*15432' 2>/dev/null || echo 'No existing tunnel to kill'
          
          echo 'Starting new tunnel...'
          nohup /opt/homebrew/bin/cloudflared access tcp --hostname postgres-thakii-02.fanusdigital.site --url localhost:15432 > /tmp/postgres_tunnel_manual.log 2>&1 &
          
          echo 'Waiting 5 seconds for tunnel to start...'
          sleep 5
          
          echo 'Testing connection after manual start:'
          nc -z localhost 15432 && echo '✅ Tunnel working after manual start!' || echo '❌ Tunnel still not working'
          
          echo ''
          echo '=== MANUAL TUNNEL LOG ==='
          if [ -f /tmp/postgres_tunnel_manual.log ]; then
            echo 'Manual tunnel log:'
            cat /tmp/postgres_tunnel_manual.log
          fi
          
          echo ''
          echo '=== FINAL POSTGRESQL TEST ==='
          PGPASSWORD='P@ssw0rd768_DB' psql -h localhost -p 15432 -U thakii_user -d thakii_production -c 'SELECT COUNT(*) as video_count FROM video_tasks;' 2>&1 && echo '✅ PostgreSQL connection successful!' || echo '❌ PostgreSQL connection still failing'
        "
