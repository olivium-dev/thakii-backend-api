name: Fetch Backend Logs

on:
  workflow_dispatch:

env:
  SERVER_HOST: thakii-02.fds-1.com
  SERVER_USER: ec2-user

jobs:
  fetch_logs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Cloudflare Tunnel for SSH
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        mkdir -p ~/.ssh
        echo "${{ secrets.thakii_ssh_private_key }}" > ~/.ssh/thakii-key
        chmod 600 ~/.ssh/thakii-key
        
        echo "Host thakii-server" >> ~/.ssh/config
        echo "  HostName $SERVER_HOST" >> ~/.ssh/config
        echo "  User $SERVER_USER" >> ~/.ssh/config
        echo "  IdentityFile ~/.ssh/thakii-key" >> ~/.ssh/config
        echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
        echo "  StrictHostKeyChecking no" >> ~/.ssh/config
        chmod 600 ~/.ssh/config
    
    - name: Check Batch Import and Video Status
      run: |
        echo "📋 Checking batch import jobs..."
        ssh thakii-server "
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            SELECT job_id, status, total_videos, processed_videos, failed_videos, share_url, created_at 
            FROM batch_import_jobs 
            ORDER BY created_at DESC 
            LIMIT 5;
          \"
          echo ''
          echo '📋 Video tasks status summary:'
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            SELECT status, COUNT(*) FROM video_tasks GROUP BY status ORDER BY status;
          \"
          echo ''
          echo '📋 Recent video tasks:'
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            SELECT video_id, filename, status, created_at FROM video_tasks ORDER BY created_at DESC LIMIT 10;
          \"
        "
    
    - name: Fetch Backend Logs
      run: |
        echo "📋 Fetching backend service logs..."
        ssh thakii-server "
          sudo journalctl -u thakii-backend.service --no-pager -n 100 | grep -iE 'batch|import|worker|error|trigger' | tail -50 || echo 'No matching logs found'
        "
