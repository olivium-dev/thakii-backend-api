name: Fix Backend and Test

on:
  workflow_dispatch:

env:
  SERVER_HOST: thakii-02.fds-1.com
  SERVER_USER: ec2-user
  BACKEND_PATH: /home/ec2-user/thakii-backend-api

jobs:
  fix_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Setup SSH
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        mkdir -p ~/.ssh
        echo "${{ secrets.thakii_ssh_private_key }}" > ~/.ssh/thakii-key
        chmod 600 ~/.ssh/thakii-key
        
        echo "Host thakii-server" >> ~/.ssh/config
        echo "  HostName $SERVER_HOST" >> ~/.ssh/config
        echo "  User $SERVER_USER" >> ~/.ssh/config
        echo "  IdentityFile ~/.ssh/thakii-key" >> ~/.ssh/config
        echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
        echo "  StrictHostKeyChecking no" >> ~/.ssh/config
        chmod 600 ~/.ssh/config
    
    - name: Check and Fix Backend
      run: |
        ssh thakii-server "
          echo '=== CHECKING BACKEND STATUS ==='
          
          # Check if backend service is running
          echo 'Backend service status:'
          sudo systemctl status thakii-backend.service --no-pager | head -15
          
          echo ''
          echo 'Checking if backend is responding:'
          curl -s -m 5 http://localhost:5001/health || echo 'Backend not responding locally'
          
          echo ''
          echo 'Checking nginx status:'
          sudo systemctl status nginx --no-pager | head -10
          
          echo ''
          echo 'Restarting backend service...'
          sudo systemctl restart thakii-backend.service
          
          echo 'Waiting for backend to start...'
          sleep 5
          
          echo 'Checking backend after restart:'
          sudo systemctl status thakii-backend.service --no-pager | head -10
          
          echo ''
          echo 'Testing local backend health:'
          curl -s -m 5 http://localhost:5001/health | jq '.' || echo 'Still not responding'
          
          echo ''
          echo 'Testing external backend health:'
          curl -s -m 5 https://thakii-02.fanusdigital.site/thakii-be/health | jq '.' || echo 'External access failed'
        "
    
    - name: Reset Queue and Test Upload
      run: |
        ssh thakii-server "
          echo '=== RESETTING QUEUE ==='
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            UPDATE video_tasks 
            SET status = 'failed',
                error_message = 'Reset for fresh testing after backend restart',
                updated_at = NOW()
            WHERE status IN ('in_queue', 'processing', 'uploaded');
          \"
          
          echo 'Queue reset complete. Current status:'
          PGPASSWORD=P@ssw0rd768_DB psql -h localhost -U thakii_user -d thakii_production -c \"
            SELECT status, COUNT(*) as count 
            FROM video_tasks 
            WHERE created_at > NOW() - INTERVAL '1 day'
            GROUP BY status 
            ORDER BY count DESC;
          \"
        "
        
        echo ""
        echo "=== TESTING FRESH UPLOAD ==="
        
        # Test upload
        BACKEND_TOKEN="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..FHONNJ8H57bDsnishJYMHUqjIsZwLqecivVRmSQ9pxI"
        
        echo "Creating test file..."
        echo "Backend Restart Test - $(date)" > /tmp/backend_test.txt
        
        echo "Testing upload..."
        UPLOAD_RESULT=$(curl -s -w "%{http_code}" -X POST https://thakii-02.fanusdigital.site/thakii-be/upload \
          -H "Authorization: Bearer $BACKEND_TOKEN" \
          -F "file=@/tmp/backend_test.txt")
        
        HTTP_CODE="${UPLOAD_RESULT: -3}"
        RESPONSE_BODY="${UPLOAD_RESULT%???}"
        
        echo "HTTP Code: $HTTP_CODE"
        echo "Response: $RESPONSE_BODY"
        
        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ Upload successful!"
          VIDEO_ID=$(echo "$RESPONSE_BODY" | jq -r '.video_id')
          echo "Video ID: $VIDEO_ID"
          
          # Monitor for 3 minutes
          echo "🔍 Monitoring video $VIDEO_ID for 3 minutes..."
          
          for i in {1..12}; do
            echo "Check $i/12..."
            
            STATUS_RESULT=$(curl -s https://thakii-02.fanusdigital.site/thakii-be/list \
              -H "Authorization: Bearer $BACKEND_TOKEN" | \
              jq --arg vid "$VIDEO_ID" '.videos[] | select(.video_id == $vid)')
            
            if [ ! -z "$STATUS_RESULT" ]; then
              STATUS_VALUE=$(echo "$STATUS_RESULT" | jq -r '.status')
              echo "Status: $STATUS_VALUE"
              
              if [ "$STATUS_VALUE" = "done" ] || [ "$STATUS_VALUE" = "completed" ]; then
                echo "🎉 SUCCESS! Video processing completed!"
                exit 0
              elif [ "$STATUS_VALUE" = "failed" ]; then
                echo "❌ Video failed"
                echo "$STATUS_RESULT" | jq '.error_message'
                exit 1
              fi
            fi
            
            sleep 15
          done
          
          echo "⏰ Monitoring timeout - final status: $STATUS_VALUE"
          if [ "$STATUS_VALUE" = "in_queue" ]; then
            echo "❌ Video still stuck in queue"
            exit 1
          fi
        else
          echo "❌ Upload failed with HTTP $HTTP_CODE"
          echo "Response: $RESPONSE_BODY"
          exit 1
        fi
