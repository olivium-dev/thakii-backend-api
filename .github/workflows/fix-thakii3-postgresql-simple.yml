name: Fix thakii-3 PostgreSQL Simple

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-thakii3-postgresql-simple.yml']

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
    - name: Install PostgreSQL Client on thakii-3
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        sudo apt-get update && sudo apt-get install -y sshpass
        
        echo "🔧 INSTALLING POSTGRESQL CLIENT ON THAKII-3"
        
        sshpass -p "12344321" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          -o ProxyCommand="cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site" \
          fanusdigital@ssh-thakii-3.fanusdigital.site "
          
          echo 'Installing PostgreSQL client...'
          /opt/homebrew/bin/brew install libpq
          
          echo 'Adding to PATH...'
          echo 'export PATH=\"/opt/homebrew/opt/libpq/bin:\$PATH\"' >> ~/.zshrc
          export PATH=\"/opt/homebrew/opt/libpq/bin:\$PATH\"
          
          echo 'Installing Python dependencies...'
          cd ~/thakii-worker-service
          pip3 install psycopg2-binary
          
          echo 'Testing PostgreSQL connection...'
          PGPASSWORD='P@ssw0rd768_DB' /opt/homebrew/opt/libpq/bin/psql -h localhost -p 15432 -U thakii_user -d thakii_production -c 'SELECT NOW();' || echo 'Connection failed'
          
          echo 'Testing Python connection...'
          python3 -c \"
import psycopg2
conn = psycopg2.connect(host='localhost', port='15432', dbname='thakii_production', user='thakii_user', password='P@ssw0rd768_DB')
print('✅ Python PostgreSQL connection successful!')
conn.close()
\" || echo 'Python connection failed'
          
          echo 'Restarting worker...'
          pkill -f 'python.*api_server' || echo 'No worker to kill'
          cd ~/thakii-worker-service
          export PATH=\"/opt/homebrew/opt/libpq/bin:\$PATH\"
          nohup python3 api_server.py > worker.log 2>&1 &
          sleep 3
          ps aux | grep 'python.*api_server' | grep -v grep && echo '✅ Worker restarted' || echo '❌ Worker failed'
        "
