name: Test thakii-3 to thakii-02 PostgreSQL Connection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-thakii3-to-thakii02-connection.yml'

jobs:
  test_connection:
    runs-on: ubuntu-latest
    
    steps:
    - name: Setup Cloudflare
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        sudo apt-get update && sudo apt-get install -y sshpass
    
    - name: Test PostgreSQL Connection from thakii-3 to thakii-02
      run: |
        echo "🔍 TESTING POSTGRESQL CONNECTION: thakii-3 → thakii-02"
        echo "===================================================="
        
        sshpass -p "12344321" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          -o ProxyCommand="cloudflared access ssh --hostname ssh-thakii-3.fanusdigital.site" \
          fanusdigital@ssh-thakii-3.fanusdigital.site "
          
          echo '=== CURRENT TUNNEL STATUS ==='
          ps aux | grep 'cloudflared.*15432' | grep -v grep || echo 'No PostgreSQL tunnel running'
          
          echo ''
          echo '=== TESTING TUNNEL CONNECTIVITY ==='
          nc -z localhost 15432 && echo '✅ Tunnel port accessible' || echo '❌ Tunnel port not accessible'
          
          echo ''
          echo '=== CHECKING WHAT thakii-02 PostgreSQL IS LISTENING ON ==='
          echo 'Testing if thakii-02 PostgreSQL is accessible via tunnel...'
          
          # Install minimal PostgreSQL client if not available
          if ! command -v psql &> /dev/null; then
            echo 'Installing minimal PostgreSQL client...'
            /opt/homebrew/bin/brew install libpq
            export PATH=\"/opt/homebrew/opt/libpq/bin:\$PATH\"
          else
            echo 'PostgreSQL client already available'
          fi
          
          echo ''
          echo '=== TESTING DIRECT CONNECTION TO thakii-02 PostgreSQL ==='
          echo 'Attempting connection via Cloudflare tunnel (localhost:15432 → thakii-02:5432)...'
          
          # Test connection with timeout
          timeout 10 /opt/homebrew/bin/psql -h localhost -p 15432 -U thakii_user -d thakii_production -c 'SELECT NOW() as connection_test, version();' 2>&1 || echo 'Connection failed or timed out'
          
          echo ''
          echo '=== CHECKING PYTHON POSTGRESQL DEPENDENCIES ==='
          cd ~/thakii-worker-service
          
          # Check if psycopg2 is installed
          python3 -c 'import psycopg2; print(\"✅ psycopg2 available:\", psycopg2.__version__)' 2>/dev/null || echo '❌ psycopg2 not available'
          
          echo ''
          echo '=== TESTING PYTHON CONNECTION TO thakii-02 ==='
          python3 -c \"
import sys
try:
    import psycopg2
    print('✅ psycopg2 imported successfully')
    
    # Test connection
    conn = psycopg2.connect(
        host='localhost',
        port='15432', 
        dbname='thakii_production',
        user='thakii_user',
        password='P@ssw0rd768_DB',
        connect_timeout=10
    )
    
    cur = conn.cursor()
    cur.execute('SELECT NOW(), COUNT(*) FROM video_tasks WHERE status = %s;', ('in_queue',))
    result = cur.fetchone()
    print(f'✅ Python PostgreSQL connection successful!')
    print(f'   Current time on thakii-02: {result[0]}')
    print(f'   Videos in queue: {result[1]}')
    
    conn.close()
    
except ImportError as e:
    print(f'❌ psycopg2 import failed: {e}')
except Exception as e:
    print(f'❌ PostgreSQL connection failed: {e}')
\"
          
          echo ''
          echo '=== CHECKING WORKER CONFIGURATION ==='
          cd ~/thakii-worker-service
          
          # Check if worker has PostgreSQL configuration
          if [ -f core/postgres_integration.py ]; then
            echo 'PostgreSQL integration file exists'
            grep -n 'localhost.*15432' core/postgres_integration.py || echo 'No localhost:15432 configuration found'
          else
            echo 'PostgreSQL integration file missing'
          fi
          
          echo ''
          echo '=== TESTING WORKER HEALTH ENDPOINT ==='
          curl -s http://localhost:8000/health | python3 -m json.tool 2>/dev/null || echo 'Worker health check failed'
        "
