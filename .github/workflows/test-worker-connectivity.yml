name: Test Worker Connectivity from Backend

on:
  workflow_dispatch:

env:
  SERVER_HOST: thakii-02.fds-1.com
  SERVER_USER: ec2-user
  BACKEND_PATH: /home/ec2-user/ThakiiBackend.Api

jobs:
  test_connectivity:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Cloudflare Tunnel for SSH
      run: |
        curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared.deb
        mkdir -p ~/.ssh
        echo "${{ secrets.thakii_ssh_private_key }}" > ~/.ssh/thakii-key
        chmod 600 ~/.ssh/thakii-key
        
        echo "Host thakii-server" >> ~/.ssh/config
        echo "  HostName $SERVER_HOST" >> ~/.ssh/config
        echo "  User $SERVER_USER" >> ~/.ssh/config
        echo "  IdentityFile ~/.ssh/thakii-key" >> ~/.ssh/config
        echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
        echo "  StrictHostKeyChecking no" >> ~/.ssh/config
        chmod 600 ~/.ssh/config
    
    - name: Test Worker Connectivity
      run: |
        echo "🧪 Testing worker connectivity (from runner)..."
        echo "Backend /health:"
        curl -s https://thakii-02.fanusdigital.site/thakii-be/health | jq '.' || echo "Health check failed"
        echo ""
        echo "Backend /worker-health (admin):"
        curl -s https://thakii-02.fanusdigital.site/thakii-be/worker-health | jq '.' || echo "Worker health endpoint may require auth"
        echo ""
        echo "Primary worker:"
        curl -s https://thakii-3.fanusdigital.site/thakii-worker/health | jq '.' || true
        echo "Fallback worker:"
        curl -s https://thakii-02.fanusdigital.site/thakii-worker/health | jq '.' || true
