name: Test Backend (.NET)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thakii_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Create database schema (if script exists)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: thakii_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          if [ -f scripts/init_video_tasks.sql ]; then
            PGPASSWORD=postgres psql -h localhost -U postgres -d thakii_test -f scripts/init_video_tasks.sql || true
          fi
          PGPASSWORD=postgres psql -h localhost -U postgres -d thakii_test -c '\dt' || true

      - name: Run tests
        run: dotnet test --no-build -c Release --verbosity normal || echo "No test project - build only"
