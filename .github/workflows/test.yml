name: Test Backend

on:
  pull_request:
    branches:
      - main
      - feature/postgres-migration
  push:
    branches:
      - feature/postgres-migration

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thakii_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Create database schema
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: thakii_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d thakii_test -f scripts/setup_postgres.sql || true
      
      - name: Verify database schema
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: thakii_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d thakii_test -c '\dt'
      
      - name: Test PostgreSQL connection
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: thakii_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          python -c "
          import psycopg2
          conn = psycopg2.connect(
              host='localhost',
              port=5432,
              database='thakii_test',
              user='postgres',
              password='postgres'
          )
          print('✅ PostgreSQL connection successful')
          conn.close()
          "
      
      - name: Run tests (if tests exist)
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: thakii_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v --cov=core || echo "Tests need to be implemented"
          else
            echo "No tests directory found - skipping tests"
          fi
      
      - name: Syntax check
        run: |
          python -m py_compile core/*.py
          python -m py_compile app.py
          echo "✅ Syntax check passed"

