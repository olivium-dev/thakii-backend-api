# CORS origin map: allow Netlify production and localhost/127.0.0.1 for development.
# Include this in http context (e.g. /etc/nginx/conf.d/) so $cors_origin is available in server blocks.
map $http_origin $cors_origin {
    default                               "";
    "https://thakii-frontend.netlify.app" "https://thakii-frontend.netlify.app";
    ~^http://localhost(:[0-9]+)?$         $http_origin;
    ~^http://127\.0\.0\.1(:[0-9]+)?$      $http_origin;
}
